name: Audit

# Weekly, not on push. These checks find problems that appear WITHOUT this repo
# changing — a CVE published against a dependency, a link that rotted, an action
# tag repointed upstream. A failure emails you; that's the whole notification
# mechanism, and no invocation is required.
#
# The checks themselves live in hawkesj12/workflows so every repo shares one copy.
#
# The CVE check reads a LOCKFILE, which is why uv.lock is committed even though
# this is a library that ships loose ranges. Without one, osv-scanner finds no
# package sources and the job passes having examined nothing — a green shield
# that reads as "no CVEs" when it means "nothing was scanned". The lock pins the
# resolution CI audits, not what users get on `pip install`.

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 09:00 ET (cron is UTC; 13:00 UTC = 09:00 EDT)
  workflow_dispatch: # run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  audit:
    # Pinned to a TAG, not @main — and not for the usual reason. This is my own
    # repo, so the supply-chain risk unpinned-uses guards against (someone else
    # repointing a ref) genuinely doesn't apply. The reason is blast radius:
    # @main has no staging channel, so every caller's next scheduled run executes
    # whatever was last pushed there, and you find out from failure emails rather
    # than a diff. A tag makes main the place changes get tried and this the thing
    # the fleet runs. Dependabot bumps this line — its github-actions ecosystem
    # covers reusable-workflow refs — so the pin reconciles instead of rotting.
    uses: hawkesj12/workflows/.github/workflows/audit.yml@v1.0.0
    permissions:
      # The UNION of what every job in the called workflow needs. Permissions only
      # narrow down a reusable-workflow chain, so granting less than a called
      # workflow declares is a startup_failure — no jobs, no log, no annotation.
      contents: read
      actions: read # osv-scanner reusable workflow
      security-events: write # ditto (declared even with upload-sarif: false)
      id-token: write # Scorecard's OIDC
    with:
      docs: "README.md CHANGELOG.md"
      scorecard: true # repolens is public, so Scorecard can publish
