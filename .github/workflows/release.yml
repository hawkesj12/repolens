name: Release

# TWO ways in, by design:
#   • push a v* TAG   → publish to REAL PyPI + cut a GitHub Release (production).
#   • run manually    → publish to TestPyPI only, no GitHub Release (a rehearsal).
# A manual run can NEVER reach real PyPI — production is tag-only — so the
# rehearsal is safe to fire anytime, and it exercises the same build → version →
# twine → publish spine the tag path uses.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Re-run the full suite on the commit being released. `ci.yml` triggers on
  # push-to-main and pull_request, neither of which fires for a tag — so without
  # this job a release would publish having run no tests at all.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # no push needed; keeps the token out of .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist

      - name: Verify the tag matches the packaged version
        # Tag runs only. A tag of v0.13.2 that ships 0.13.1 is unrecoverable once
        # published, because a PyPI version can never be replaced. A manual
        # rehearsal has no tag, so this check is skipped there.
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "tag=$TAG  pyproject=$PKG"
          [ "$TAG" = "$PKG" ] || { echo "MISMATCH: tag $TAG != pyproject $PKG"; exit 1; }

      - name: Check metadata renders on the index
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # No GitHub environment on purpose. PyPI's trusted-publisher matcher compares the
    # environment claim WITHOUT stripping whitespace (warehouse _check_environment:
    # case-insensitive `.lower()` but no `.strip()`), so an invisible space in the
    # publisher's environment field — which is not readable via any API — silently
    # breaks matching. With no environment set here, the OIDC token carries no
    # environment claim, and a publisher whose environment field is left truly empty
    # ("" hits the matcher's short-circuit) matches unconditionally. We use no
    # environment protection rules, so nothing is lost.
    permissions:
      # REQUIRED for Trusted Publishing: mints the short-lived OIDC token the
      # index exchanges for a 15-minute, project-scoped upload token. No stored
      # secret. Attestations (PEP 740) are produced by default under Trusted
      # Publishing and ride this same identity.
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          # Empty string → the action's default (real PyPI). On a manual rehearsal,
          # point it at TestPyPI so production is only ever reached via a tag.
          repository-url: ${{ github.event_name == 'push' && '' || 'https://test.pypi.org/legacy/' }}

  # Tag runs only — a rehearsal must not cut a public Release.
  github-release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a Release writes to the repo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # no push needed; keeps the token out of .git/config
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release from the changelog
        # pypa/gh-action-pypi-publish publishes to the index and nothing else —
        # creating a Release is explicitly outside its scope, so it happens here.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md \
            | sed '/./,$!d' > notes.md
          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          fi
